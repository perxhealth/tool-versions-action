name: Preflight

on:
  pull_request:
  push:
    branches:
      - '**'

jobs:
  vitest:
    name: ⚡️ Vitest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Node setup
        uses: actions/setup-node@v6
        with:
          node-version: 24.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 8.15.1
          run_install: false

      - name: Download deps
        run: pnpm install

      - name: Lint
        run: pnpm test

  lint:
    name: ⬣ ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Node setup
        uses: actions/setup-node@v6
        with:
          node-version: 24.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 8.15.1
          run_install: false

      - name: Download deps
        run: pnpm install

      - name: Lint
        run: pnpm lint

  typecheck:
    name: ʦ TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 8.15.1
          run_install: false

      - name: Node setup
        uses: actions/setup-node@v6
        with:
          node-version: 24.0.0

      - name: Download deps
        run: pnpm install

      - name: Compile
        run: pnpm tsc

  package:
    name: 📦 Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 8.15.1
          run_install: false

      - name: Node setup
        uses: actions/setup-node@v6
        with:
          node-version: 24.0.0

      - name: Download deps
        run: pnpm install

      - name: Package release
        run: pnpm package
